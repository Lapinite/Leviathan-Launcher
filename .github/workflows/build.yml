name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Leviathan Launcher
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build project
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build
          elif [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ]; then
            gradle build
          else
            echo "No Gradle project files are currently present."
            echo "Leviathan Launcher is still in private development, so there is nothing to compile in this repository yet."
            echo "The workflow will begin compiling automatically once the Gradle project is added."
          fi
